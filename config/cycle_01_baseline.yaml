experiment:
  cycle_id: "cycle_01"
  run_id: "r01"
  hypothesis: "Modelo baseline com variáveis mínimas atende aos limiares mínimos de qualidade e supera o método de referência."
  target_variable: "et0_mm"
  reference_method: "fao_pm"
  validation_method: "time_series_split"
  random_seed: 42

data:
  input_path: "data/processed/F3_setelagoasINMET.txt"
  date_column: "Data"
  required_columns:
    - "Data"
    - "etoFAOPM"
    - "etoHS"
    - "Rs"
    - "MinTemp"
    - "MaxTemp"
    - "Precipitation"
    - "Wind"
    - "RH"
    - "Pressure"
  physical_bounds:
    etoFAOPM: {min: 1, max: 12.0}
    etoHS: {min: 1, max: 12.0}
    Rs: {min: 0, max: 40000.0}
    MinTemp: {min: 5, max: 24.0}
    MaxTemp: {min: 14, max: 45.0}
    Precipitation: {min: 0, max: 100.0}
    Wind: {min: 0, max: 45.0}
    RH: {min: 10, max: 100.0}
    Pressure: {min: 90, max: 940.0}

quality_gates:
  max_missing_ratio: 0.50          # até 5% de ausências por coluna exigida
  max_out_of_bounds_ratio: 0.20  # até 1% de valores fora da faixa física
  min_records: 365                 # mínimo de registros diários para rodar o ciclo
  fail_on_gate_breach: true        # interrompe o pipeline se reprovar

evaluation_thresholds:
  max_rmse_mm_day: 1.50
  max_mae_mm_day: 1.10
  min_r2: 0.70

outputs:
  base_runs_dir: "outputs/runs"